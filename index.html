<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Apache</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 3rem 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .container img {
      width: 80px;
      margin-bottom: 1rem;
    }

    h1 {
      color: #e63946;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .info {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 5px;
      font-size: 0.95rem;
      text-align: left;
    }

    .info strong {
      color: #111;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #888;
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://www.apache.org/img/asf_logo.png" alt="Apache Logo">
    <h1>It works!</h1>
    <p>This is the default landing page for the Apache HTTP Server.</p>
    <div class="info">
      <p><strong>Server IP:</strong> 127.0.0.1</p>
      <p><strong>Document Root:</strong> /var/www/html</p>
      <p><strong>Configuration File:</strong> /etc/httpd/conf/httpd.conf</p>
    </div>
    <footer>
      Apache HTTP Server · Powered by Open Source
    </footer>
  </div>
</body>
</html>
